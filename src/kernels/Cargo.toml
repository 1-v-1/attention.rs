[package]
name = "kernels"
version = "0.6.9"
edition = "2021"
description = "Attention, MoE and GEMM kernels for Rust"
categories = ["science"]
license = "MIT OR Apache-2.0"
# The crate builds and links native CUDA/C++ archives.  Declaring `links`
# makes cargo hand the build script's metadata to dependent crates, so the
# attention.rs wrapper can forward the link directives to its own
# dependents (binaries, examples, integration tests).
links = "kernels"

[dependencies]

[build-dependencies]
cudaforge = "0.1.6"
anyhow = { version = "1", features = ["backtrace"] }
sha2 = "0.10"
ureq = { version = "2.10", default-features = true }

[features]
no-marlin = []
no-fp8-kvcache = []
cutlass = []
flash = []
flashinfer = []
trtllm = ["flashinfer"]
